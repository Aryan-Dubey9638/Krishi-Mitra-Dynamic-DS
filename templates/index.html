<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic RAG - Agricultural Advisory</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>
    <div class="container">
        <header>
            <h1>Agricultural Advisory Platform</h1>
        </header>

        <main>
            <div class="chat-container" id="chat-container">
                <div class="message system-message">
                    Hello! I am your Agricultural Assistant. How can I help you calculate net profits or provide market insights today?
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="user-input" placeholder="e.g. What is my net profit for 500kg Grade-A Tomatoes from Pune to Azadpur?" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="send-button">Send</button>
            </div>
        </main>
    </div>

    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            addMessage(message, 'user-message');
            inputField.value = '';
            
            const btn = document.getElementById('send-button');
            btn.disabled = true;
            btn.innerText = 'Thinking...';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    addMessage('Error: ' + data.error, 'system-message');
                } else {
                    addMessage(data.response, 'bot-message', true);
                }
            } catch (err) {
                addMessage('Error connecting to the server.', 'system-message');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send';
            }
        }

        function addMessage(text, className, preformatted=false) {
            const chatContainer = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            
            if (preformatted) {
                const pre = document.createElement('pre');
                pre.textContent = text;
                msgDiv.appendChild(pre);
            } else {
                msgDiv.textContent = text;
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
